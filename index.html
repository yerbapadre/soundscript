<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SoundScript</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="bar">
    <div class="logo">SOUND<span>SCRIPT</span></div>

    <div class="ctl"><label>ROOT</label><select id="root"></select></div>
    <div class="ctl"><label>SCALE</label><select id="scale"></select></div>
    <div class="ctl"><label>VOICE</label><select id="voice"></select></div>
    <div class="ctl"><label>REVERB</label><input id="reverb" type="range" min="0" max="100" value="70" /></div>
    <div class="ctl"><label>VOL</label><input id="vol" type="range" min="0" max="100" value="70" /></div>

    <div class="spacer"></div>

    <span id="clock">0.0s</span>
    <button id="rec" class="rec">● REC</button>
    <button id="play">▶ PLAY</button>
    <button id="stop" disabled>■ STOP</button>
    <button id="export" disabled>↓ WAV</button>
  </div>

  <div class="tracks" id="tracks">
    <h4>TRACKS · arm one, hit REC, layer over the rest</h4>
  </div>

  <div class="hint" id="hint">start typing — <kbd>A</kbd>–<kbd>Z</kbd> play the scale · <kbd>space</kbd> rests</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
